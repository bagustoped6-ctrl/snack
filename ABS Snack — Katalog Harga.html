<title>ABS Snack — Katalog Harga</title>

<style>
:root {
  --bg: #FFF8F0;
  --surface: #FFFFFF;
  --ink: #2C1A1A;
  --ink-soft: #9B7B7B;
  --accent: #7D3354;
  --border: #F0DDD5;
  --wa: #25D366;
  --overlay: rgba(44,26,26,0.85);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1E1215;
    --surface: #2A1820;
    --ink: #FFF8F0;
    --ink-soft: #C4A0A0;
    --border: #3D2030;
    --overlay: rgba(0,0,0,0.92);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;}

header{background:#7D3354;color:#fff;text-align:center;padding:28px 20px 20px;}
header h1{font-family:'DM Serif Display',serif;font-size:1.8rem;font-weight:400;margin-bottom:3px;}
header p{font-size:11px;opacity:.65;}

.section-tab{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
.section-tab::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--ink-soft);cursor:pointer;transition:.15s;}
.tab-btn.active{background:#7D3354;border-color:#7D3354;color:#fff;}

main{max-width:480px;margin:0 auto;padding:14px 10px 60px;}
.section{display:none;}
.section.active{display:block;}
.section-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:4px 2px 10px;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.card-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
.card-body{padding:9px 10px 11px;display:flex;flex-direction:column;gap:7px;flex:1;}
.card-title{font-size:12px;font-weight:600;line-height:1.3;color:var(--ink);}
.card-desc{font-size:10px;color:var(--ink-soft);line-height:1.4;}
.price-list{display:flex;flex-direction:column;gap:3px;}
.price-row{display:flex;justify-content:space-between;font-size:11px;}
.price-size{color:var(--ink-soft);}
.price-val{font-weight:600;color:var(--ink);}
.btn-wa{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--wa);color:#fff;text-decoration:none;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:600;margin-top:2px;}
.btn-wa svg{width:14px;height:14px;fill:#fff;flex-shrink:0;}

/* LIGHTBOX */
.lb-overlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.lb-overlay.open{display:flex;}
.lb-top{width:100%;max-width:400px;display:flex;justify-content:flex-end;margin-bottom:10px;}
.lb-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.lb-track-wrap{width:100%;max-width:400px;overflow:hidden;border-radius:12px;}
.lb-track{display:flex;transition:transform .3s ease;will-change:transform;}
.lb-slide{flex-shrink:0;width:100%;}
.lb-slide img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;}
.lb-dots{display:flex;gap:6px;margin-top:12px;justify-content:center;}
.lb-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;border:none;transition:.2s;}
.lb-dot.active{background:#fff;}
.lb-title{color:#fff;font-size:13px;font-weight:600;margin-top:12px;text-align:center;}

footer{text-align:center;padding:14px;font-size:11px;color:var(--ink-soft);border-top:1px solid var(--border);}
</style>
</head>
<body>

<header>
  <h1>ABS <em>Snack</em></h1>
  <p>Katalog Harga • Order via WhatsApp</p>
</header>

<div class="section-tab">
  <button class="tab-btn active" onclick="switchTab('semua',this)">Semua</button>
  <button class="tab-btn" onclick="switchTab('kiloan',this)">Kiloan</button>
  <button class="tab-btn" onclick="switchTab('snack',this)">Snack</button>
  <button class="tab-btn" onclick="switchTab('kemasan',this)">Kemasan</button>
</div>

<main>
  <div id="sec-semua" class="section active"></div>
  <div id="sec-kiloan" class="section"></div>
  <div id="sec-snack" class="section"></div>
  <div id="sec-kemasan" class="section"></div>
</main>

<!-- LIGHTBOX -->
<div class="lb-overlay" id="lightbox" onclick="lbClickOutside(event)">
  <div class="lb-top"><button class="lb-close" onclick="closeLb()">✕</button></div>
  <div class="lb-track-wrap" id="lbWrap">
    <div class="lb-track" id="lbTrack"></div>
  </div>
  <div class="lb-dots" id="lbDots"></div>
  <p class="lb-title" id="lbTitle"></p>
</div>

<footer>ABS Snack · Min. order 1 pcs · Harga belum termasuk ongkir</footer>

function buildCard(p) {
  const vars = p.variants.map(v=>`<div class="price-row"><span class="price-size">${v[0]}</span><span class="price-val">Rp ${v[1]}</span></div>`).join('');
  const waMsg = encodeURIComponent(`Halo, saya ingin order *${p.name}*`);
  const desc = p.desc ? `<p class="card-desc">${p.desc}</p>` : '';
  return `<div class="card" onclick="openLb(${JSON.stringify(p.imgs)},${JSON.stringify(p.name)})">
    <img class="card-img" src="${p.imgs[0]}" alt="${p.name}" loading="lazy">
    <div class="card-body">
      <p class="card-title">${p.name}</p>
      ${desc}
      <div class="price-list">${vars}</div>
      <a class="btn-wa" href="https://wa.me/${WA}?text=${waMsg}" onclick="event.stopPropagation()">${waIcon} Pesan</a>
    </div>
  </div>`;
}

function renderAll() {
  const cats = {semua: products, kiloan: products.filter(p=>p.cat==='kiloan'), snack: products.filter(p=>p.cat==='snack'), kemasan: products.filter(p=>p.cat==='kemasan')};
  for (const [key, list] of Object.entries(cats)) {
    const el = document.getElementById('sec-'+key);
    el.innerHTML = `<div class="grid">${list.map(buildCard).join('')}</div>`;
  }
}

function switchTab(key, btn) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+key).classList.add('active');
}

// LIGHTBOX
let lbIdx = 0, lbImgs = [];
let startX = 0;

function openLb(imgs, title) {
  lbImgs = imgs.filter(Boolean);
  lbIdx = 0;
  const track = document.getElementById('lbTrack');
  track.innerHTML = lbImgs.map(src=>`<div class="lb-slide"><img src="${src}" alt=""></div>`).join('');
  document.getElementById('lbTitle').textContent = title;
  renderDots();
  moveTo(0);
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeLb() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
}

function lbClickOutside(e) {
  if(e.target === document.getElementById('lightbox')) closeLb();
}

function moveTo(idx) {
  lbIdx = idx;
  document.getElementById('lbTrack').style.transform = `translateX(-${idx*100}%)`;
  document.querySelectorAll('.lb-dot').forEach((d,i)=>d.classList.toggle('active',i===idx));
}

function renderDots() {
  const dots = document.getElementById('lbDots');
  dots.innerHTML = lbImgs.map((_,i)=>`<button class="lb-dot${i===0?' active':''}" onclick="moveTo(${i})"></button>`).join('');
}

// Swipe support
const lbWrap = document.getElementById('lbWrap');
lbWrap.addEventListener('touchstart', e=>{ startX = e.touches[0].clientX; }, {passive:true});
lbWrap.addEventListener('touchend', e=>{
  const diff = startX - e.changedTouches[0].clientX;
  if(Math.abs(diff)>40) { diff>0 ? moveTo(Math.min(lbIdx+1,lbImgs.length-1)) : moveTo(Math.max(lbIdx-1,0)); }
});
// Mouse drag
let mouseDown=false, mouseStartX=0;
lbWrap.addEventListener('mousedown',e=>{mouseDown=true;mouseStartX=e.clientX;});
lbWrap.addEventListener('mouseup',e=>{
  if(!mouseDown) return; mouseDown=false;
  const diff=mouseStartX-e.clientX;
  if(Math.abs(diff)>40){ diff>0?moveTo(Math.min(lbIdx+1,lbImgs.length-1)):moveTo(Math.max(lbIdx-1,0)); }
});

renderAll();
</script>
